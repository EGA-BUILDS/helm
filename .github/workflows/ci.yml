name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Convex URL is public (it is inlined into the client bundle by
      # NEXT_PUBLIC_), so CI can build with a placeholder. No secrets, no
      # hosted backend, and no Convex deploy happen here.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (Cache Components enabled)
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://ci-placeholder.invalid"
